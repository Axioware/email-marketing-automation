# Paste inside your existing `server { listen 443 ssl; server_name your-domain; ... }` block, then
#   sudo nginx -t && sudo systemctl reload nginx
# The containers check the keys themselves (X-API-Key for the scraper, x-reacher-secret for Reacher).

# https://your-domain/scraper/...  ->  scraper container (MAPS_SCRAPER_URL=https://your-domain/scraper)
location /scraper/ {
    proxy_pass http://127.0.0.1:8001/;  # the trailing / drops the /scraper prefix
    proxy_read_timeout 340s;            # one search can take 5 minutes
    proxy_send_timeout 340s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# https://your-domain/reacher/...  ->  Reacher (REACHER_URL=https://your-domain/reacher)
location /reacher/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_read_timeout 120s;            # one mail-server conversation can take a minute
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
