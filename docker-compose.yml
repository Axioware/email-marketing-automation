# Local SearXNG (web search for decision makers). Start it with
#   docker compose up -d
# The database is Supabase; Reacher (email verification) is started by the app itself; the Google Maps scraper
# container runs from its own repo.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: email-automation-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env (any random text)}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
