# What Vercel installs and runs. Keep `dependencies` the same as requirements.txt (a test checks it).
[project]
name = "email-marketing-automation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-filter>=24.0",
    "whitenoise>=6.7",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "markdown>=3.5",
    "phonenumbers>=8.13",
    "pycountry>=24.6",
    "celery>=5.3",
]

[tool.vercel]
entrypoint = "emailautomation.wsgi:application"

# Batches of scraper/Reacher runs (pipeline/webruns.py), invoked only by Vercel Queues.
[[tool.vercel.subscribers]]
entrypoint = "vercel_worker:app"
